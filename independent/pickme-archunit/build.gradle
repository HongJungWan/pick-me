// ArchUnit FreezingArchRule이 archunit_store/ 경로를 JVM user.dir 기준으로 해석한다.
// CI(GitHub Actions)에서 user.dir이 프로젝트 루트가 되면 store를 찾지 못해
// frozen 위반 67건이 전부 "신규 위반"으로 감지되어 테스트가 실패한다.
// → 테스트 실행 시 workingDir을 이 모듈 디렉토리로 고정하여 경로를 보장한다.
tasks.named('test') {
    workingDir = project.projectDir
}

dependencies {
    testImplementation project(':common:pickme-common')
    testImplementation project(':domain-modules:pickme-order')
    testImplementation project(':domain-modules:pickme-payment')
    testImplementation project(':domain-modules:pickme-product')
    testImplementation project(':domain-modules:pickme-inventory')
    testImplementation project(':domain-modules:pickme-member')
    testImplementation project(':domain-modules:pickme-partner')
    testImplementation project(':domain-modules:pickme-notification')
    testImplementation project(':domain-modules:pickme-settlement')
    testImplementation project(':common:pickme-orchestration-api')
    testImplementation project(':application:pickme-orchestration')

    // Phase 5: 인프라 모듈도 ArchUnit 분석 대상에 포함 (도메인 비의존 검증용)
    testImplementation project(':application:pickme-gateway')
    testImplementation project(':application:pickme-config-server')
    testImplementation project(':application:pickme-discovery')

    testImplementation libs.archunit.junit5
    testImplementation libs.spring.boot.starter.web
}

// Phase 5: gateway/config-server/discovery 가 Spring Cloud BOM 의존성을 사용하므로
// archunit 모듈에서도 클래스패스 해결을 위해 BOM 을 임포트한다.
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.1"
    }
}
