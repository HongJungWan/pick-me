spring:
  application:
    name: pickme-inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://postgres-inventory:5432/inventory_db}
    username: ${INVENTORY_DB_USER:pickme}
    password: ${INVENTORY_DB_PASS:pickme1234}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:pickme1234}

server:
  port: 8083
