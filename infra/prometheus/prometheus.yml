global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'pickme-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['pickme-app:8080']

  - job_name: 'kafka-connect'
    static_configs:
      - targets: ['kafka-connect:9875']

  # Temporal SDK 클라이언트 메트릭은 pickme-app의 /actuator/prometheus에서 노출됨 (TemporalMetricsConfig)
  # Temporal Server 자체 메트릭이 필요한 경우 별도 포트 설정 후 활성화
  # - job_name: 'temporal-server'
  #   static_configs:
  #     - targets: ['temporal:9090']
