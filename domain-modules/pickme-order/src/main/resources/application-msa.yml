# Order 서비스 독립 실행 시 설정 (MSA 전환 후)
# Kafka, Redis → Config Server (config/application.yml)로 이관 완료

spring:
  application:
    name: pickme-order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://postgres-order:5432/order_db}
    username: ${ORDER_DB_USER:pickme}
    password: ${ORDER_DB_PASS:pickme1234}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8081
