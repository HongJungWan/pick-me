# Inventory 서비스 독립 실행 시 설정 (MSA 전환 후)
# Kafka, Redis → Config Server로 이관 완료

spring:
  application:
    name: pickme-inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://postgres-inventory:5432/inventory_db}
    username: ${INVENTORY_DB_USER:pickme}
    password: ${INVENTORY_DB_PASS:pickme1234}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8083
