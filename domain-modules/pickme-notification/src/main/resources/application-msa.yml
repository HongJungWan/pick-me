# Notification 서비스 독립 실행 시 설정 (MSA 전환 후)
# Kafka, Redis → Config Server로 이관 완료

spring:
  application:
    name: pickme-notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://postgres-notification:5432/notification_db}
    username: ${NOTIFICATION_DB_USER:pickme}
    password: ${NOTIFICATION_DB_PASS:pickme1234}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8087
