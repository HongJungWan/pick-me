# Member 서비스 독립 실행 시 설정 (MSA 전환 후)
# Kafka, Redis → Config Server로 이관 완료

spring:
  application:
    name: pickme-member-service
  datasource:
    url: ${MEMBER_DB_URL:jdbc:postgresql://postgres-member:5432/member_db}
    username: ${MEMBER_DB_USER:pickme}
    password: ${MEMBER_DB_PASS:pickme1234}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8085
