# Payment 서비스 독립 실행 시 설정 (MSA 전환 후)
# Kafka, Redis → Config Server로 이관 완료

spring:
  application:
    name: pickme-payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://postgres-payment:5432/payment_db}
    username: ${PAYMENT_DB_USER:pickme}
    password: ${PAYMENT_DB_PASS:pickme1234}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8082
