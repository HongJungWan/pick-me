server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: pickme-notification
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://postgres:5432/pickme_db}
    username: ${DB_USER:pickme}
    password: ${DB_PASS:pickme1234}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

pickme:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
