server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pickme-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/inventory/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/products/**
        - id: member-service
          uri: ${MEMBER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/members/**,/api/v1/auth/**
        - id: partner-service
          uri: ${PARTNER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/partners/**
        - id: settlement-service
          uri: ${SETTLEMENT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/settlements/**
