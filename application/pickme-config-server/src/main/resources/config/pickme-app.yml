server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pickme-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/pickme_db}
    username: ${DB_USER:pickme}
    password: ${DB_PASS:pickme1234}
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
