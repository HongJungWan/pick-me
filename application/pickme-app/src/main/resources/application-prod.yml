# Production 프로필 — Config Server가 제공하지 않는 서비스 고유 설정만 유지
# Kafka, Redis, HikariCP Timeout → Config Server로 이관 완료

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.pickme: INFO
    root: WARN
