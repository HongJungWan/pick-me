# Timeout 정책 — Config Server로 이관 완료
# HikariCP, Resilience4j, 분산 락, 모듈별 풀 → Config Server (config/application.yml)
# 이 파일에는 Config Server에 없는 고유 설정만 유지

spring:
  data:
    redis:
      timeout: 1000
  kafka:
    producer:
      properties:
        delivery.timeout.ms: 3000
        request.timeout.ms: 1500
    consumer:
      properties:
        max.poll.interval.ms: 30000
        session.timeout.ms: 10000
