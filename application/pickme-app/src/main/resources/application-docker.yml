# Docker 프로필 — Config Server가 제공하지 않는 서비스 고유 설정만 유지
# Kafka, Redis, Timeout, Circuit Breaker → Config Server (config/application.yml)로 이관 완료

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/pickme_db
    username: pickme
    password: pickme1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

pickme:
  datasource:
    routing:
      enabled: false
    replica:
      url: jdbc:postgresql://postgres:5432/pickme_db

logging:
  level:
    com.pickme: INFO
